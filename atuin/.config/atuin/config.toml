# atuin config: https://docs.atuin.sh/configuration/config/
# Local-only: no account, no server, nothing leaves the machine.
# To enable sync later: `atuin register` / `atuin login`, then set auto_sync.

auto_sync = false
update_check = false

## Search
# Start scoped to the current directory; <C-r> cycles the filter, so global
# history is one keypress away when the local scope is too narrow.
filter_mode = "host"
filter_mode_shell_up_key_binding = "directory"
search_mode = "fuzzy"

## UI
style = "compact"
inline_height = 20
show_preview = true
show_help = false
# Starts in insert so you can just type; esc drops to normal, matching zsh-vi-mode.
keymap_mode = "vim-insert"

## Recording
# Trailing space still suppresses a command, as in zsh's HIST_IGNORE_SPACE.
history_filter = [
  "^ ",
  "^(atuin|clear|exit|pwd|ls|lsd|j)$",
]

# Secrets end up on the command line more often than anyone admits.
secrets_filter = true
