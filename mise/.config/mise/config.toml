# Tools every machine gets. MISE_ENV (set in zsh/.zprofile from the answers
# bootstrap.sh stored) layers the rest on top:
#   desktop -> config.desktop.toml   containers, extra languages, cargo tools
#   remote  -> config.remote.toml    what brew provides on a desktop
#   work    -> config.work.toml      work-only tools
# Per-project tool versions still come from each project's own mise config.

[tools]
"npm:neovim" = "latest"
"pipx:mypy" = "latest"
atuin = "latest"
bat = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
lsd = "latest"
node = { version = "latest", postinstall = "corepack enable" }
python = "3.14"
ripgrep = "latest"
ruff = "latest"
starship = "latest"
uv = "latest"
xh = "latest"
yazi = "latest"
zoxide = "latest"

[settings]
env_file = ".env"
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[settings.python]
uv_venv_auto = false
uv_venv_create_args = ["--seed"]
